# Firebase App Hosting config for founder-fit-6a455 (backend "founder-fit" in us-east4; the region is fixed when a backend is created).
# Docs: https://firebase.google.com/docs/app-hosting/configure
# Vertex AI uses the backend's service account (ADC). GEMINI_API_KEY is local-dev only and must never be added.
# The only secret is OBSERVABILITY_TOKEN, held in Cloud Secret Manager (never its value here).

runConfig:
  minInstances: 0
  maxInstances: 2 # cost cap; the default is 100

env:
  # Firebase web app config. Not secrets (access is enforced by Firestore rules); needed at build time
  # because Next.js inlines NEXT_PUBLIC_* values into the browser bundle.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCqPFMzbP8AJsxDEhpgP4dF0n1qTbVV8Y0
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: founder-fit-6a455.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: founder-fit-6a455
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: founder-fit-6a455.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "455074705484"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:455074705484:web:50923e871c7647b67e44e9"
    availability: [BUILD, RUNTIME]

  # Gemini on Vertex AI for /api/narrative (server-only). Switch the location to "global" if the model 404s in us-central1.
  - variable: GOOGLE_CLOUD_LOCATION
    value: us-central1
    availability: [RUNTIME]
  - variable: GEMINI_MODEL
    value: gemini-3.5-flash
    availability: [RUNTIME]

  # Who may use FounderFit (checked by /api/access and /api/narrative). An account is allowed when its
  # email is verified and matches FOUNDERFIT_ALLOWED_DOMAINS or FOUNDERFIT_ALLOWED_EMAILS (comma-separated,
  # case-insensitive). With both unset, production allows nobody.
  - variable: FOUNDERFIT_ALLOWED_DOMAINS
    value: sciencewerx.org
    availability: [RUNTIME]
  # To allow individual accounts outside the domain, uncomment and list them:
  # - variable: FOUNDERFIT_ALLOWED_EMAILS
  #   value: "someone@gmail.com, other@partner.com"
  #   availability: [RUNTIME]
  # Narrative calls per user per UTC day (counters in the server-only Firestore collection narrativeUsage).
  - variable: FOUNDERFIT_NARRATIVE_DAILY_LIMIT
    value: "30"
    availability: [RUNTIME]

  # ScienceWerx observability: request metrics and server errors go to the portal's Monitoring page.
  # Create the secret before deploying: firebase apphosting:secrets:set OBSERVABILITY_TOKEN
  # (then grant the backend access when asked, or: firebase apphosting:secrets:grantaccess OBSERVABILITY_TOKEN --backend founder-fit)
  - variable: OBSERVABILITY_TOKEN
    secret: OBSERVABILITY_TOKEN
    availability: [RUNTIME]

  # ScienceWerx Connect v1: share data with the other ScienceWerx apps server to server, matched by verified
  # email (see README "ScienceWerx Connect"). Off until configured: with these unset, /api/connect/peers
  # calls nobody and /api/connect/v1/summary answers every caller with 401.
  # CONNECT_KEY is FounderFit's own caller key, in Secret Manager (apphosting:secrets:set CONNECT_KEY,
  # then apphosting:secrets:grantaccess CONNECT_KEY --backend founder-fit).
  - variable: CONNECT_KEY
    secret: CONNECT_KEY
    availability: [RUNTIME]
  # Peers FounderFit calls (istartup's summary, prismscore/istartup certificates).
  - variable: CONNECT_PEERS
    value: "istartup=https://istartupscore.com,prismscore=https://www.prismscore.us"
    availability: [RUNTIME]
  # Apps allowed to call FounderFit's summary: name:sha256hex-of-their-CONNECT_KEY:scopes (hashes only, not secret).
  - variable: CONNECT_CALLERS
    value: "istartup:09bef6c8aa1dd4ab2a37c617a85ce2cd986c1d73d0e4eb765a4d204695ef87b1:summary"
    availability: [RUNTIME]
